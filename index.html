<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3d4653">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <title>사진에 글 넣기</title>
</head>
<body>
  <main class="app">
    <div class="title-row"><h1>사진에 글 넣기</h1><span class="version">ver. 0.14</span></div>

    <section class="controls" aria-label="글 설정">
      <div id="textInputs" class="text-inputs"></div>
      <button id="clearTextButton" type="button" class="text-link">글 모두 지우기</button>
    </section>

    <section id="editor" class="editor" hidden>
      <div id="stageArea" class="stage-area">
        <div id="stageWrap" class="stage-wrap">
          <canvas id="photoCanvas"></canvas>
          <div id="overlay" class="overlay" aria-label="글 위치 조정 영역"></div>
        </div>
      </div>
      <p class="drag-help">글 상자를 끌어 위치를 조정하세요. 두 손가락으로 확대·이동할 수 있어요.</p>
    </section>

    <div class="actions">
      <label class="file-label"><span id="photoLabelText">사진 선택</span><input id="photoInput" type="file" accept="image/*"></label>
      <button id="saveButton" type="button" disabled>저장</button>
    </div>
    <p class="save-hint">저장을 누르면 완성 사진이 새 창으로 열려요. 그 화면의 공유 버튼 → 이미지 저장을 눌러야 사진 보관함에 들어갑니다.</p>
    <p id="status" class="status" role="status"></p>
  </main>
  <div id="undoToast" class="toast" role="status" hidden><span id="undoText"></span><button id="undoButton" type="button">되돌리기</button></div>
  <!-- 오래된 PWA 캐시를 우회하기 위해 query version을 사용했다가 삭제함 -->
  <script src="app.js"></script>
</body>
</html>
